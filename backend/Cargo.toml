[package]
name = "cpr-account-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cpr-account-probe"
path = "src/main.rs"

[dependencies]
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "47d30474af7c3e1fab433f2d4a70430fae548ff2", features = ["io"] }
getrandom = "0.3.3"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
